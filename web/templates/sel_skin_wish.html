{%extends "base.html" %}

{% block title %} 

ValoVault - Adicionar Wishlish

{% endblock %}


{% block conteudo %}

    <br><br>

    <div class="container">
        <div class="text-center">
            <p class="h1">Adicionar Skin à Wishlist</p>
            <br>
            <p class="h3">Selecione a skin</p>
        </div>
    </div>

    <br><br>

    <div class="container">

        <form method="post" action="{{ url_for('sel_skin_wish') }}">
            <div class="row">
                {% for b in bundles %}
                <div class="col">
                    <input type="radio" name="skin" class="visually-hidden" id="{{ b[0] }}" value="{{ b[0] }}">
                    <label for="{{ b[0] }}">
                        <img src="/static/Bundles/{{ b[1] }}.png" alt="{{ b[1] }}" width="512">
                    </label>
                    <br><br>
                </div>
                {% endfor %}
            </div>
            <br><br>
            <div class="text-center">
                <button type="submit" class="btn btn-dark btn-lg">Selecionar</button>
            </div>
            <br><br>
        </form>
    </div>


{% endblock %}
